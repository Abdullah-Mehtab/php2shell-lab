; CVE-2026-109618 lab config for mod_php
;
; memory_limit must be finite and small enough that post_max_size can
; exceed it by ~12M.  PHP defaults (128M limit, 8M post_max_size) block
; the OOM trigger.  This config simulates an upload-heavy deployment.
memory_limit = 8M
post_max_size = 256M
upload_max_filesize = 256M

; session.upload_progress -- the vulnerable code path
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0

; session config
session.save_path = /tmp
session.use_strict_mode = 0

; display_errors lets the exploit auto-detect memory_limit from the
; OOM error message.  Without it, pass --memory-limit manually.
display_errors = On
error_reporting = E_ALL
