services:
  php:
    image: php:8.4-fpm
    volumes:
      - ./www:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/zz-lab.ini
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - lab

  nginx:
    image: nginx:alpine
    volumes:
      - ./www:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:8898:80"
    depends_on:
      - php
    networks:
      - lab

networks:
  lab:
    driver: bridge
