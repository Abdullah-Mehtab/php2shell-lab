server {
    listen 80;
    root /var/www/html;
    index index.php;

    # Disable request buffering so slow uploads stream directly to PHP-FPM
    # This widens the race window for the session.upload_progress attack
    fastcgi_request_buffering off;
    client_max_body_size 256m;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
