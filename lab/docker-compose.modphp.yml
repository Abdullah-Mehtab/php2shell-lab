# Apache mod_php variant -- highest risk SAPI for CVE-2026-109618
#
# mod_php runs PHP inside the Apache process. Request cleanup runs
# even when request startup fails (OOM during multipart parsing),
# making this the confirmed application-independent RCE path.
#
# Usage:
#   docker-compose -f docker-compose.modphp.yml up -d
#   curl http://127.0.0.1:8899/index.php
#
# Test with:
#   python3 ../chains/chain2_oom/trigger_oom.py --port 8899

services:
  apache-php:
    image: php:8.4-apache
    volumes:
      - ./www:/var/www/html
      - ./php-modphp.ini:/usr/local/etc/php/conf.d/zz-lab.ini
    ports:
      - "127.0.0.1:8899:80"
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
